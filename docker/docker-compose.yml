services:
  cbgl:

    build:
      context: ../..
      dockerfile: cbgl/docker/Dockerfile

    image: li9i/cbgl:lyrical
    container_name: cbgl
    tty: true
    network_mode: "host"
    ipc: host

    volumes:
      - ./shared-input:/home/cbgl/shared-input:rw
      - ./shared-output:/home/cbgl/shared-output:rw
